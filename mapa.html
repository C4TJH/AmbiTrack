<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmbiTrack - Mapa de Reportes</title>
    <link rel="icon" href="icons/favicon.ico">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/mapa.css">
</head>

<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="icons/apple-touch-icon.png" alt="AmbiTrack Logo" class="navbar-logo">
            <div class="logo">AmbiTrack</div>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="reportar.html">Reportar</a>
            <a href="ver_reportes.html">Explorar</a>
            <a href="mapa.html" class="active">Mapa</a>
            <a href="juegos.html">Juegos</a>

            <div class="auth-buttons">
                <!-- Login Button (Default Visible) -->
                <a href="login.html" id="btnLogin" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                </a>

                <!-- User Dropdown (Hidden initially) -->
                <div id="userMenu" class="user-menu-container">
                    <div class="user-avatar-btn">
                        <div class="user-avatar-initial" id="userInitial">U</div>
                        <span class="user-name-display" id="userGreeting">Usuario</span>
                        <i class="fas fa-chevron-down" style="font-size: 0.8rem; margin-left: 5px; color: #64748b;"></i>
                    </div>

                    <div class="dropdown-menu">
                        <a href="dashboard.html" class="dropdown-item" id="adminLink" style="display:none;">
                            <i class="fas fa-chart-line"></i> Dashboard
                        </a>
                        <div class="dropdown-divider"></div>
                        <button id="btnLogout" class="dropdown-item text-danger"
                            style="width: 100%; border: none; background: none; cursor: pointer;">
                            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div id="map"></div>

    <!-- Firebase global -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <!-- Configuración -->
    <script src="assets/js/firebase-config.js"></script>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDC9XxyRGPDCeNzAzxpcJQsvDXipH6a9FU&callback=initMap"
        async defer></script>

    <!-- Lógica del Mapa -->
    <script src="assets/js/mapa.js"></script>
    <script src="assets/js/navbar.js"></script>

</body>

</html>
